# SPDX-License-Identifier: GPL-2.0-or-later
#
# Assemble a release as a DRAFT. Nothing here is visible to an operator.
#
# Two things go wrong when tagging publishes directly, and both have happened:
#
#   1. Nobody gets to look. v1.85 and v1.86 were cut by a tag push and were
#      public before anyone could check what was inside them.
#   2. What is inside is not what the source says. Both of those releases
#      shipped a native library older than the code it was built from — the
#      FT8 SNR fix in one, the WSPR stack-overflow fix in the other — because
#      the native libraries are committed by hand and nobody had rebuilt them.
#
# This workflow is the rehearsal: it assembles a release as a draft, from a
# tag, without publishing anything, so the artifacts can be looked at before a
# tag push makes them public.
#
# The platform builds are the existing release-appimage / release-macos /
# release-windows workflows, called rather than copied, so there is one
# definition of how each installer is made — and each of them runs the
# native-freshness check itself, so the tag path is covered too and this
# workflow does not need to repeat it.

name: release-draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to assemble (e.g. v1.87). Create the tag first."
        required: true
        type: string

permissions:
  contents: write

jobs:
  appimage:
    uses: ./.github/workflows/release-appimage.yml
    with:
      tag: ${{ inputs.tag }}
      draft: true
    secrets: inherit

  macos:
    uses: ./.github/workflows/release-macos.yml
    with:
      tag: ${{ inputs.tag }}
      draft: true
    secrets: inherit

  windows:
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ inputs.tag }}
      draft: true
    secrets: inherit

  summary:
    needs: [appimage, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Point at the draft
        run: |
          {
            echo "### Draft assembled for ${{ inputs.tag }}"
            echo
            echo "Nothing is public yet. Review the draft's assets, then run"
            echo "**release-publish** against the same tag to make it visible."
          } >> "$GITHUB_STEP_SUMMARY"
