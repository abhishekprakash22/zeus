# Build and publish the macOS installer on every release tag — the macOS
# sibling of release-appimage and release-windows. The heavy lifting
# already lives in-tree: installers/create-macos-app.sh builds Zeus.app +
# Zeus Server.app from a dotnet publish, and create-macos-pkg.sh wraps
# them into openhpsdr-zeus-<ver>-macos-<arch>.pkg. This workflow publishes
# osx-arm64 (Apple Silicon — the modern fleet; add an x64 matrix leg if
# Intel demand appears), runs both scripts with the tag's version, and
# attaches the .pkg to the SAME release the AppImages and setup.exe land
# on. Ad-hoc signing per the script; unsigned-notarization caveat applies
# (right-click -> Open on first launch).

name: release-macos

on:
  # A tag publishes, as it always did. The two manual workflows
  # (release-draft / release-publish) exist to rehearse a release before
  # tagging: assemble it as a draft, look at it, then tag for real.
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.87)."
        required: true
        type: string
      draft:
        description: "Attach to a draft release rather than publishing."
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.87)."
        required: true
        type: string
      draft:
        description: "Attach to a draft release rather than publishing."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  # See Directory.Build.props: a release build must say so explicitly.
  # Workflow-level so every job inherits it, including jobs added later.
  ZEUS_RELEASE_BUILD: "true"

jobs:
  # v1.85 shipped a libzeus_ft8 older than the measured-SNR fix and v1.86 a
  # libzeus_wspr older than the stack-overflow fix, both down this path. The
  # check is seconds; the build is not, so it goes first.
  freshness:
    name: Native binaries are not older than their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
          # Compares commit dates, so it needs the history.
          fetch-depth: 0

      - name: Check native freshness
        run: bash tools/check-native-freshness.sh

  build:
    needs: freshness
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: |
          cd zeus-web
          npm ci
          npm run build

      # The operator's manual PDF. Field (v1.108, Windows 11): About -> User
      # Manual returned 'page can't be found'. Only the Linux AppImage job
      # ever built the PDF; Windows and macOS shipped without it, so every
      # non-Linux operator has had a dead link since the manual moved into
      # wwwroot. Same build as Linux — build.mjs finds Chrome/Edge on the
      # runner — staged into wwwroot AFTER the frontend build (which empties
      # wwwroot) and BEFORE publish (whose content glob picks it up).
      - name: Build operator's manual PDF
        env:
          MANUAL_CHROME_EXTRA_FLAGS: "--no-sandbox --disable-dev-shm-usage"
        run: |
          node docs/manual/build.mjs
          test -s docs/manual/build/Zeus-Operator-Manual.pdf
          cp docs/manual/build/Zeus-Operator-Manual.pdf Zeus.Server.Hosting/wwwroot/Zeus-Operator-Manual.pdf
          ls -la Zeus.Server.Hosting/wwwroot/Zeus-Operator-Manual.pdf

      - name: Publish (osx-arm64, self-contained)
        run: |
          dotnet publish OpenhpsdrZeus/OpenhpsdrZeus.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:PublishReadyToRun=true \
            -p:VersionPrefix=${{ steps.version.outputs.version }} \
            -p:DebugType=embedded \
            -p:DebugSymbols=false

      - name: Build .app bundles
        # Belt to the git-mode fix: never a Permission denied on a fresh
        # checkout again, whatever bit a future script forgets.
        run: |
          chmod +x installers/*.sh
          ./installers/create-macos-app.sh "${{ steps.version.outputs.version }}" arm64

      - name: Build .pkg installer
        run: |
          f="OpenhpsdrZeus/bin/Release/net10.0/osx-arm64/publish/wwwroot/Zeus-Operator-Manual.pdf"
          test -s "$f" || { echo "manual PDF missing from publish payload: $f" >&2; exit 1; }
          ./installers/create-macos-pkg.sh "${{ steps.version.outputs.version }}" arm64

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name != 'push' && inputs.draft }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: installers/output/*.pkg
