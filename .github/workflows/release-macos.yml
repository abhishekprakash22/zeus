# Build and publish the macOS installer on every release tag — the macOS
# sibling of release-appimage and release-windows. The heavy lifting
# already lives in-tree: installers/create-macos-app.sh builds Zeus.app +
# Zeus Server.app from a dotnet publish, and create-macos-pkg.sh wraps
# them into openhpsdr-zeus-<ver>-macos-<arch>.pkg. This workflow publishes
# osx-arm64 (Apple Silicon — the modern fleet; add an x64 matrix leg if
# Intel demand appears), runs both scripts with the tag's version, and
# attaches the .pkg to the SAME release the AppImages and setup.exe land
# on. Ad-hoc signing per the script; unsigned-notarization caveat applies
# (right-click -> Open on first launch).

name: release-macos

on:
  # No push trigger. Tagging must not publish anything by itself: a release is
  # assembled as a DRAFT by release-draft.yml, looked at, and only then made
  # public by release-publish.yml. v1.85 and v1.86 both went straight to
  # operators carrying a native library older than its own source, and nobody
  # had a chance to look first.
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.87)."
        required: true
        type: string
      draft:
        description: "Attach to a draft release rather than publishing."
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.87)."
        required: true
        type: string
      draft:
        description: "Attach to a draft release rather than publishing."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: |
          cd zeus-web
          npm ci
          npm run build

      - name: Publish (osx-arm64, self-contained)
        run: |
          dotnet publish OpenhpsdrZeus/OpenhpsdrZeus.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:PublishReadyToRun=true \
            -p:VersionPrefix=${{ steps.version.outputs.version }} \
            -p:DebugType=embedded \
            -p:DebugSymbols=false

      - name: Build .app bundles
        # Belt to the git-mode fix: never a Permission denied on a fresh
        # checkout again, whatever bit a future script forgets.
        run: |
          chmod +x installers/*.sh
          ./installers/create-macos-app.sh "${{ steps.version.outputs.version }}" arm64

      - name: Build .pkg installer
        run: ./installers/create-macos-pkg.sh "${{ steps.version.outputs.version }}" arm64

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.draft }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: installers/output/*.pkg
