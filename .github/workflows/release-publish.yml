# SPDX-License-Identifier: GPL-2.0-or-later
#
# Make an existing draft release public. It builds nothing.
#
# That is the point. If publishing rebuilt the artifacts, what reaches
# operators would be a different set of bytes from the one that was reviewed,
# and the review would mean nothing. This flips exactly the draft that
# release-draft.yml assembled, assets untouched.

name: release-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the draft release to publish (e.g. v1.87)."
        required: true
        type: string
      latest:
        description: "Mark it as the latest release."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything that is not a draft with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          view=$(gh release view "${{ inputs.tag }}" \
                   --repo "${{ github.repository }}" \
                   --json isDraft,assets 2>/dev/null) || {
            echo "No release exists for ${{ inputs.tag }}. Run release-draft first." >&2
            exit 1
          }

          if [ "$(echo "$view" | jq -r .isDraft)" != "true" ]; then
            echo "${{ inputs.tag }} is already public. Nothing to do." >&2
            exit 1
          fi

          # A draft with no assets means a platform build failed and the
          # release was never actually assembled; publishing it would offer
          # operators a download page with nothing on it.
          n=$(echo "$view" | jq '.assets | length')
          if [ "$n" -eq 0 ]; then
            echo "Draft ${{ inputs.tag }} has no assets — did every platform build succeed?" >&2
            exit 1
          fi
          echo "Draft ${{ inputs.tag }} carries $n asset(s)."
          echo "$view" | jq -r '.assets[].name' | sed 's/^/  /'

      # latest.json is first written by release-appimage, before the Windows
      # and macOS builds attach their installers — so it listed only the
      # AppImages, and every Windows/macOS "Update now" fell back to a download
      # page (field: v1.130, Win 11). Rebuild it here from EVERY asset on the
      # draft, with the same tool, before the release goes public. This adds
      # no new bytes to what was reviewed: the manifest is metadata computed
      # from the reviewed files (names, sizes, SHA-256).
      - name: Check out the tagged tools
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Rebuild latest.json from every asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          gh release download "$TAG" --repo "${{ github.repository }}" --dir /tmp/rel \
            --pattern '*.AppImage' --pattern '*.exe' --pattern '*.pkg'
          ls -la /tmp/rel
          echo '{}' > /tmp/empty-manifest.json
          ZEUS_DOWNLOAD_VERSION="${TAG#v}" \
          ZEUS_DOWNLOAD_BRANCH="$TAG" \
          GITHUB_SHA="$(git rev-parse HEAD)" \
          DOWNLOAD_BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG" \
            node tools/update-download-manifest.mjs /tmp/rel /tmp/empty-manifest.json /tmp/rel/latest.json
          # Release assets are flat under the tag (the tool emits upstream's
          # CDN layout, .../versions/X.Y.Z/<file>), as release-appimage does.
          DOWNLOAD_BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG" node -e '
            const fs = require("fs");
            const p = "/tmp/rel/latest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            const base = process.env.DOWNLOAD_BASE_URL.replace(/\/$/, "");
            for (const a of m.assets) a.url = base + "/" + a.filename;
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
            // Every downloaded installer must be in the manifest, or that
            // platform silently loses in-app updates again.
            const files = fs.readdirSync("/tmp/rel").filter(f => /\.(AppImage|exe|pkg)$/.test(f));
            const listed = new Set(m.assets.map(a => a.filename));
            const missing = files.filter(f => !listed.has(f));
            if (missing.length) { console.error("not in manifest: " + missing.join(", ")); process.exit(1); }
            for (const a of m.assets) console.log(a.platform, a.arch, a.kind, a.filename);
          '
          gh release upload "$TAG" /tmp/rel/latest.json --repo "${{ github.repository }}" --clobber
          echo "latest.json rebuilt with $(jq '.assets | length' /tmp/rel/latest.json) assets." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest=${{ inputs.latest }}
          echo "Published ${{ inputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
