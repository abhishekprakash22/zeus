# Build and publish the Windows x64 installer on every release tag — the
# Windows sibling of release-appimage.yml. Steps mirror the PROVEN
# build-windows-dev.yml pipeline (publish -> payload verify -> WebView2
# bootstrapper -> Inno Setup); the difference is the trigger (tags +
# dispatch crank, same as the AppImage workflow) and the destination
# (the tag's GitHub Release instead of workflow artifacts). The version
# stamped into the installer is the tag itself.

name: release-windows

on:
  # A tag publishes, as it always did. The two manual workflows
  # (release-draft / release-publish) exist to rehearse a release before
  # tagging: assemble it as a draft, look at it, then tag for real.
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.87)."
        required: true
        type: string
      draft:
        description: "Attach to a draft release rather than publishing."
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.87)."
        required: true
        type: string
      draft:
        description: "Attach to a draft release rather than publishing."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  # See Directory.Build.props: a release build must say so explicitly.
  # Workflow-level so every job inherits it, including jobs added later.
  ZEUS_RELEASE_BUILD: "true"

jobs:
  # v1.85 shipped a libzeus_ft8 older than the measured-SNR fix and v1.86 a
  # libzeus_wspr older than the stack-overflow fix, both down this path. The
  # check is seconds; the build is not, so it goes first.
  freshness:
    name: Native binaries are not older than their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
          # Compares commit dates, so it needs the history.
          fetch-depth: 0

      - name: Check native freshness
        run: bash tools/check-native-freshness.sh

  build:
    needs: freshness
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        shell: bash
        run: |
          cd zeus-web
          npm ci
          npm run build

      # The operator's manual PDF. Field (v1.108, Windows 11): About -> User
      # Manual returned 'page can't be found'. Only the Linux AppImage job
      # ever built the PDF; Windows and macOS shipped without it, so every
      # non-Linux operator has had a dead link since the manual moved into
      # wwwroot. Same build as Linux — build.mjs finds Chrome/Edge on the
      # runner — staged into wwwroot AFTER the frontend build (which empties
      # wwwroot) and BEFORE publish (whose content glob picks it up).
      - name: Build operator's manual PDF
        shell: bash
        env:
          MANUAL_CHROME_EXTRA_FLAGS: "--no-sandbox --disable-dev-shm-usage"
        run: |
          node docs/manual/build.mjs
          test -s docs/manual/build/Zeus-Operator-Manual.pdf
          cp docs/manual/build/Zeus-Operator-Manual.pdf Zeus.Server.Hosting/wwwroot/Zeus-Operator-Manual.pdf
          ls -la Zeus.Server.Hosting/wwwroot/Zeus-Operator-Manual.pdf

      - name: Publish (win-x64, self-contained)
        # EXACTLY the dev pipeline's flags (build-windows-dev.yml) — its
        # 'single binary' comment is loose prose; the publish is
        # MULTI-FILE, and both the payload verifier (expects runtimes\
        # native dir + per-assembly DLLs) and zeus-windows.iss are written
        # for that layout. Adding -p:PublishSingleFile here is what woke
        # the IL3000 analyzer and then failed the verifier. Version is the
        # tag, stamped the commit-55 way (VersionPrefix).
        shell: bash
        run: |
          dotnet publish OpenhpsdrZeus/OpenhpsdrZeus.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishReadyToRun=true \
            -p:VersionPrefix=${{ steps.version.outputs.version }} \
            -p:DebugType=embedded \
            -p:DebugSymbols=false

      - name: Verify the manual shipped
        shell: bash
        run: |
          f="OpenhpsdrZeus/bin/Release/net10.0/win-x64/publish/wwwroot/Zeus-Operator-Manual.pdf"
          test -s "$f" || { echo "manual PDF missing from publish payload: $f" >&2; exit 1; }
          ls -la "$f"

      - name: Verify installer payload
        shell: pwsh
        run: ./tools/verify-windows-installer-payload.ps1 -PublishDir "OpenhpsdrZeus/bin/Release/net10.0/win-x64/publish" -Arch "x64"

      # Bundled by zeus-windows.iss and installed behind a registry check —
      # the step this workflow was missing (Inno line 78 aborted on it).
      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          # aka.ms rides a redirect chain to a CDN that occasionally drops
          # mid-body on runners ('The response ended prematurely') — the .85
          # tag's leg died here. Two defenses: retry the fetch, and refuse a
          # truncated file. The second matters more than the first: a
          # premature end that DOESN'T throw would silently package half a
          # redistributable into every installer (vc_redist.x64 is ~25 MB;
          # anything under 10 MB is a lie).
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $out = "installers\vc_redist.x64.exe"
          $ok = $false
          foreach ($attempt in 1..5) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
              if ((Get-Item $out).Length -ge 10MB) { $ok = $true; break }
              Write-Warning "attempt ${attempt}: truncated download ($((Get-Item $out).Length) bytes)"
            } catch {
              Write-Warning "attempt ${attempt}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $ok) { throw "vc_redist fetch failed after 5 attempts" }
          Get-Item $out | Select-Object Name, Length

      - name: Fetch WebView2 bootstrapper
        shell: pwsh
        run: |
          $out = "installers\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $out

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          iscc /DMyAppVersion="${{ steps.version.outputs.version }}" /DArch="x64" installers\zeus-windows.iss

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name != 'push' && inputs.draft }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: installers/output/*.exe
