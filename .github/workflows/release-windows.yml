# Build and publish the Windows x64 installer on every release tag — the
# Windows sibling of release-appimage.yml. Steps mirror the PROVEN
# build-windows-dev.yml pipeline (publish -> payload verify -> WebView2
# bootstrapper -> Inno Setup); the difference is the trigger (tags +
# dispatch crank, same as the AppImage workflow) and the destination
# (the tag's GitHub Release instead of workflow artifacts). The version
# stamped into the installer is the tag itself.

name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.15.58). Must exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        shell: bash
        run: |
          cd zeus-web
          npm ci
          npm run build

      - name: Publish (win-x64, self-contained)
        # EXACTLY the dev pipeline's flags (build-windows-dev.yml) — its
        # 'single binary' comment is loose prose; the publish is
        # MULTI-FILE, and both the payload verifier (expects runtimes\
        # native dir + per-assembly DLLs) and zeus-windows.iss are written
        # for that layout. Adding -p:PublishSingleFile here is what woke
        # the IL3000 analyzer and then failed the verifier. Version is the
        # tag, stamped the commit-55 way (VersionPrefix).
        shell: bash
        run: |
          dotnet publish OpenhpsdrZeus/OpenhpsdrZeus.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishReadyToRun=true \
            -p:VersionPrefix=${{ steps.version.outputs.version }} \
            -p:DebugType=embedded \
            -p:DebugSymbols=false

      - name: Verify installer payload
        shell: pwsh
        run: ./tools/verify-windows-installer-payload.ps1 -PublishDir "OpenhpsdrZeus/bin/Release/net10.0/win-x64/publish" -Arch "x64"

      # Bundled by zeus-windows.iss and installed behind a registry check —
      # the step this workflow was missing (Inno line 78 aborted on it).
      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          # aka.ms rides a redirect chain to a CDN that occasionally drops
          # mid-body on runners ('The response ended prematurely') — the .85
          # tag's leg died here. Two defenses: retry the fetch, and refuse a
          # truncated file. The second matters more than the first: a
          # premature end that DOESN'T throw would silently package half a
          # redistributable into every installer (vc_redist.x64 is ~25 MB;
          # anything under 10 MB is a lie).
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $out = "installers\vc_redist.x64.exe"
          $ok = $false
          foreach ($attempt in 1..5) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
              if ((Get-Item $out).Length -ge 10MB) { $ok = $true; break }
              Write-Warning "attempt ${attempt}: truncated download ($((Get-Item $out).Length) bytes)"
            } catch {
              Write-Warning "attempt ${attempt}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $ok) { throw "vc_redist fetch failed after 5 attempts" }
          Get-Item $out | Select-Object Name, Length

      - name: Fetch WebView2 bootstrapper
        shell: pwsh
        run: |
          $out = "installers\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $out

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          iscc /DMyAppVersion="${{ steps.version.outputs.version }}" /DArch="x64" installers\zeus-windows.iss

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: installers/output/*.exe
