<?xml version="1.0" encoding="UTF-8"?>
<!-- OpenHPSDR Core — modernized mark (ANAN Core).
     Heritage: the twin staggered square-wave pulses of the classic openHPSDR
     logo (the sampled-signal identity), redrawn as glowing traces on the dark
     slate of the Zeus UI, with the app's own blue accent ramp and a quiet
     spectrum-floor baseline. App-icon format, 512x512, safe at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Zeus UI slate -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#151b24"/>
      <stop offset=".55" stop-color="#0e1218"/>
      <stop offset="1"  stop-color="#090b0f"/>
    </linearGradient>
    <!-- top sheen, very quiet -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- primary trace ramp: Zeus accent blue into signal cyan -->
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#2f7fd0"/>
      <stop offset=".5" stop-color="#4ea6ff"/>
      <stop offset="1"  stop-color="#8fd6ff"/>
    </linearGradient>
    <!-- echo trace: the deep HPSDR navy, kept in the family -->
    <linearGradient id="echo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123b66"/>
      <stop offset="1" stop-color="#1d5c9c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="#2a3341" stroke-width="3"/>

  <g clip-path="url(#tile)">
    <!-- spectrum floor: a whisper of waterfall under the traces -->
    <g opacity=".5">
      <rect x="16"  y="300" width="60" height="6" fill="#123b66"/>
      <rect x="88"  y="296" width="34" height="10" fill="#16497e"/>
      <rect x="134" y="292" width="22" height="14" fill="#1d5c9c"/>
      <rect x="168" y="298" width="46" height="8" fill="#123b66"/>
      <rect x="226" y="288" width="18" height="18" fill="#2f7fd0"/>
      <rect x="256" y="294" width="40" height="12" fill="#16497e"/>
      <rect x="308" y="290" width="16" height="16" fill="#1d5c9c"/>
      <rect x="336" y="297" width="52" height="9" fill="#123b66"/>
      <rect x="400" y="293" width="24" height="13" fill="#16497e"/>
      <rect x="436" y="299" width="60" height="7" fill="#123b66"/>
    </g>

    <!-- echo pulse: the second, staggered wave of the original, behind -->
    <path d="M 8 232 H 120 V 96 H 268 V 232 H 352 V 148 H 504"
          fill="none" stroke="url(#echo)" stroke-width="20"
          stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>

    <!-- primary pulse: the heritage square wave, lit -->
    <path d="M 8 268 H 84 V 128 H 212 V 268 H 300 V 178 H 428 V 268 H 504"
          fill="none" stroke="url(#trace)" stroke-width="24"
          stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

    <!-- sample dots on the rising edges: the 'sampled' in sampled signal -->
    <circle cx="84"  cy="268" r="9" fill="#bfe6ff"/>
    <circle cx="212" cy="128" r="9" fill="#bfe6ff"/>
    <circle cx="300" cy="268" r="9" fill="#bfe6ff"/>
    <circle cx="428" cy="178" r="9" fill="#bfe6ff"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="392" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="10"
        fill="#4ea6ff">OPENHPSDR</text>
  <text x="256" y="462" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="86" font-weight="800" letter-spacing="6"
        fill="#e8eef6">CORE</text>
</svg>
